name: CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]

jobs:
  # =========================================================
  # Testes automatizados (roda em Linux e Windows)
  # =========================================================
  test:
    name: Testes ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Rodar testes
        run: |
          python -m pytest tests/ -v --cov=engine --cov=core --cov-report=term-missing

  # =========================================================
  # Build Windows — instalador .exe via Inno Setup
  # =========================================================
  build-windows:
    name: Build Windows (Installer)
    needs: test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências de build
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install unrpa pyinstaller pywebview

      - name: Instalar Inno Setup
        shell: pwsh
        run: |
          # Tenta localizar o ISCC já instalado; senão, baixa do JR Software
          $isccPaths = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe",
            "${env:LOCALAPPDATA}\Programs\Inno Setup 6\ISCC.exe"
          )
          $iscc = $isccPaths | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $iscc) {
            Write-Host "Inno Setup não encontrado, baixando instalador do JR Software..."
            $url = "https://jrsoftware.org/download.php/is.exe"
            $dest = "$env:TEMP\is_setup.exe"
            Invoke-WebRequest -Uri $url -OutFile $dest
            Start-Process -FilePath $dest -ArgumentList "/VERYSILENT", "/NORESTART", "/DIR=C:\Program Files (x86)\Inno Setup 6" -Wait
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }

          if (-not (Test-Path $iscc)) {
            Write-Error "ISCC.exe não encontrado em $iscc após instalação."
            exit 1
          }

          Write-Host "Inno Setup encontrado em: $iscc"
          echo "ISCC_PATH=$iscc" >> $env:GITHUB_ENV

      - name: Diagnóstico antes do build
        shell: pwsh
        run: |
          Write-Host "=== Conteúdo da raiz ==="
          Get-ChildItem -Force
          Write-Host "=== Conteúdo de tools/ ==="
          Get-ChildItem -Force tools\
          Write-Host "=== Conteúdo de tools/unrpyc_master/ ==="
          Get-ChildItem -Force tools\unrpyc_master\
          Write-Host "=== Versão ==="
          Get-Content VERSION

      - name: Compilar unrpyc (master)
        shell: pwsh
        run: |
          if (-not (Test-Path "unrpyc_master.exe")) {
            Write-Host "unrpyc_master.exe não encontrado, compilando..."
            pushd tools\unrpyc_master
            pyinstaller --onefile --name unrpyc_master unrpyc.py
            popd
            Copy-Item tools\unrpyc_master\dist\unrpyc_master.exe unrpyc_master.exe
          }
          Write-Host "=== Após compilação do unrpyc ==="
          Get-ChildItem -Force unrpyc_master.exe 2>$null | Select-Object Name, Length
          Get-ChildItem -Force tools\unrpyc_master\dist\ 2>$null | Select-Object Name, Length

      - name: Build app com PyInstaller (--onedir)
        shell: pwsh
        run: |
          Write-Host "=== Verificando pré-requisitos ==="
          Write-Host "app_icon.ico existe: $(Test-Path app_icon.ico)"
          Write-Host "unrpyc_master.exe existe: $(Test-Path unrpyc_master.exe)"
          Write-Host "hook_extract_tools.py existe: $(Test-Path hook_extract_tools.py)"
          Write-Host "VERSION conteúdo: $(Get-Content VERSION)"
          Write-Host "=== Arquivos na raiz ==="
          Get-ChildItem -Force | Select-Object Name

          pyinstaller --onedir --windowed --name TranslateVN-GUI `
            --icon "app_icon.ico" `
            --add-binary "unrpyc_master.exe;tools\unrpyc_master" `
            --add-data "ui;ui" `
            --add-data "core;core" `
            --add-data "engine;engine" `
            --add-data "VERSION;." `
            --runtime-hook hook_extract_tools.py `
            --log-level DEBUG `
            gui_main.py

          Write-Host "=== Código de saída do PyInstaller: $LASTEXITCODE ==="

      - name: Diagnóstico após o PyInstaller
        shell: pwsh
        run: |
          Write-Host "=== Conteúdo de dist/ ==="
          Get-ChildItem -Force dist\ 2>$null | Select-Object Name
          Write-Host "=== Conteúdo de dist/TranslateVN-GUI/ ==="
          Get-ChildItem -Force dist\TranslateVN-GUI\ 2>$null | Select-Object Name
          Write-Host "=== Build files ==="
          Get-ChildItem -Force *.spec 2>$null | Select-Object Name

      - name: Verificar build
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\TranslateVN-GUI\TranslateVN-GUI.exe")) {
            Write-Error "Build PyInstaller falhou: dist\TranslateVN-GUI\TranslateVN-GUI.exe não existe."
            exit 1
          }

      - name: Compilar instalador com Inno Setup
        shell: pwsh
        run: |
          $version = Get-Content VERSION | Select-Object -First 1
          $iscc = $env:ISCC_PATH
          if (-not $iscc -or -not (Test-Path $iscc)) {
            Write-Error "Caminho do ISCC não definido ou inválido."
            exit 1
          }
          Write-Host "Rodando Inno Setup com versão $version..."
          & $iscc /DMyAppVersion=$version installer.iss
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Inno Setup falhou com código de saída $LASTEXITCODE"
            exit 1
          }

      - name: Verificar instalador gerado
        shell: pwsh
        run: |
          # Procura o instalador em múltiplos locais possíveis
          $candidatos = @(
            "Output\TranslateVN-Setup.exe",
            "$env:TEMP\TranslateVN-Setup-Build\TranslateVN-Setup.exe",
            (Get-ChildItem -Filter "TranslateVN-Setup.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          )
          $installer = $null
          foreach ($c in $candidatos) {
            if ($c -and (Test-Path $c)) {
              $installer = $c
              break
            }
          }

          if (-not $installer) {
            Write-Error "Instalador Inno Setup não encontrado em nenhum local esperado."
            Write-Host "=== Buscando qualquer .exe em Output/ ==="
            Get-ChildItem -Filter "*.exe" -Path Output\ -Recurse -ErrorAction SilentlyContinue | Select-Object FullName
            exit 1
          }

          Write-Host "Instalador encontrado: $installer"
          echo "INSTALLER_PATH=$installer" >> $env:GITHUB_ENV

      - name: Copiar instalador para Output
        shell: pwsh
        run: |
          $installer = $env:INSTALLER_PATH
          if (-not $installer -or -not (Test-Path $installer)) {
            Write-Error "Caminho do instalador não definido."
            exit 1
          }
          New-Item -ItemType Directory -Force -Path Output | Out-Null
          Copy-Item $installer "Output\TranslateVN-Setup.exe" -Force
          Write-Host "Instalador copiado para Output\TranslateVN-Setup.exe"

      - name: Upload artifact (instalador Windows)
        uses: actions/upload-artifact@v4
        with:
          name: TranslateVN-Setup-Windows
          path: Output/TranslateVN-Setup.exe
          retention-days: 30

      - name: Criar release (apenas se tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Output/TranslateVN-Setup.exe

  # =========================================================
  # Build Linux — tarball via PyInstaller (sem Inno Setup)
  # =========================================================
  build-linux:
    name: Build Linux (tar.gz)
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install unrpa pyinstaller pywebview

      - name: Diagnóstico antes do build
        run: |
          echo "=== Conteúdo da raiz ==="
          ls -la
          echo "=== Conteúdo de tools/ ==="
          ls -la tools/
          echo "=== Conteúdo de tools/unrpyc_master/ ==="
          ls -la tools/unrpyc_master/
          echo "=== Versão ==="
          cat VERSION

      - name: Compilar unrpyc (master)
        run: |
          if [ ! -f unrpyc_master ]; then
            echo "unrpyc_master não encontrado, compilando..."
            pushd tools/unrpyc_master
            pyinstaller --onefile --name unrpyc_master unrpyc.py
            popd
            cp tools/unrpyc_master/dist/unrpyc_master unrpyc_master
            chmod +x unrpyc_master
          fi
          echo "=== Após compilação do unrpyc ==="
          ls -la unrpyc_master 2>/dev/null || true
          ls -la tools/unrpyc_master/dist/ 2>/dev/null || true

      - name: Build app com PyInstaller (--onedir)
        run: |
          echo "=== Arquivos antes do PyInstaller ==="
          ls -la
          pyinstaller --onedir --name TranslateVN-GUI \
            --add-binary "unrpyc_master:tools/unrpyc_master" \
            --add-data "ui:ui" \
            --add-data "core:core" \
            --add-data "engine:engine" \
            --add-data "VERSION:." \
            --runtime-hook hook_extract_tools.py \
            gui_main.py

      - name: Diagnóstico após o PyInstaller
        run: |
          echo "=== Conteúdo de dist/ ==="
          ls -la dist/ 2>/dev/null || true
          echo "=== Conteúdo de dist/TranslateVN-GUI/ ==="
          ls -la dist/TranslateVN-GUI/ 2>/dev/null || true

      - name: Empacotar em tar.gz
        run: |
          version=$(cat VERSION)
          tar -czf "TranslateVN-${version}-linux-x64.tar.gz" -C dist TranslateVN-GUI

      - name: Upload artifact (Linux tarball)
        uses: actions/upload-artifact@v4
        with:
          name: TranslateVN-Linux
          path: TranslateVN-*-linux-x64.tar.gz
          retention-days: 30

      - name: Criar release (apenas se tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TranslateVN-*-linux-x64.tar.gz
          generate_release_notes: true
